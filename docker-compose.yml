services:
  postgres:
    image: postgres:16-alpine
    container_name: marketsphere-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: marketsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketsphere-web
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/marketsphere?schema=public"
      AUTH_SECRET: "marketsphere_production_super_secret_key_2026"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-""}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
